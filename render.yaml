services:
  - type: web
    name: dot-study-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --workspace @dot-study/backend --workspace @dot-study/shared --include-workspace-root && npx --workspace @dot-study/backend prisma generate && npm run build -w @dot-study/backend
    startCommand: cd backend && npx prisma migrate deploy && node dist/seed.js && node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
